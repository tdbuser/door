<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Переход…</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at top, #0f4a36 0%, #06241a 55%, #030d09 100%);
    font-family: "Nunito", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #fff; text-align: center;
  }
  .card {
    width: min(88vw, 420px); padding: 36px 24px;
    background: rgba(6, 36, 26, .75);
    border: 1px solid rgba(46, 232, 143, .35);
    border-radius: 28px;
    box-shadow: 0 0 40px rgba(46, 232, 143, .12);
  }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 900; color: #ffd23f; }
  p { margin: 0 0 22px; font-size: 16px; opacity: .85; }
  .spin {
    width: 44px; height: 44px; margin: 0 auto 22px;
    border: 4px solid rgba(255, 210, 63, .25); border-top-color: #ffd23f;
    border-radius: 50%; animation: s 0.9s linear infinite;
  }
  @keyframes s { to { transform: rotate(360deg); } }
  a.go {
    display: inline-block; padding: 14px 26px; border-radius: 16px;
    background: #2ee88f; color: #03170f; font-weight: 900; text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="spin"></div>
    <h1>Переходим…</h1>
    <p>Если страница не открылась сама, нажмите кнопку.</p>
    <a class="go" id="link" href="#">Открыть</a>
  </div>

<script>
  // ============================================================
  //  ЕДИНСТВЕННАЯ СТРОКА, КОТОРУЮ НУЖНО МЕНЯТЬ:
  var TARGET = "https://tdbuser.github.io/new-day/";
  // ============================================================

  document.getElementById("link").href = TARGET;
  window.location.replace(TARGET);
</script>
<noscript>
  <meta http-equiv="refresh" content="0; url=https://tdbuser.github.io/millioner.uz/">
</noscript>
</body>
</html>
